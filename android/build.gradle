plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

apply from: '../nitrogen/generated/android/ReactNativeAgeSignals+autolinking.gradle'

group = 'com.margelo.nitro.agesignals'
version = '0.3.1'

android {
  namespace "com.margelo.nitro.agesignals"
  compileSdk 36

  defaultConfig {
    minSdk 24
    versionCode 1
    versionName "0.3.1"

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20'
        arguments '-DANDROID_STL=c++_shared'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }

  buildFeatures {
    // Required so CMake can resolve the fbjni / ReactAndroid /
    // react-native-nitro-modules prefab packages that the nitrogen-generated
    // autolinking.cmake declares via find_package.
    prefab true
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Version is substituted by the React Native gradle plugin applied in the
  // consuming app's root project. This mirrors react-native-nitro-modules'
  // own declaration; a hard-pinned version here would fight RN's substitution.
  implementation 'com.facebook.react:react-native:+'
  implementation project(':react-native-nitro-modules')
  implementation 'com.google.android.play:age-signals:0.0.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
